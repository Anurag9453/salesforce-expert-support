packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ requires explicit opt-in for dependency lifecycle scripts.
# Each of these genuinely needs one: Prisma generates a client, esbuild and
# sharp fetch a platform binary, embedded-postgres unpacks the Postgres build.
allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
